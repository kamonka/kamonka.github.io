<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
 
  <meta name="theme-color" content="#000000">
  <title>国殇节</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .player {
      width: 100%;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    @media (orientation: portrait) {
      video {
        width: 100dvh;
        height: 100vw;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <main class="player">
    <video id="video" src="https://pic.jyjdsg.dpdns.org/hero.mp4" playsinline controls></video>
  </main>
</body>
</html>
