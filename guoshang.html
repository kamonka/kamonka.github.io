<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>国殇</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .player {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      object-fit: contain;
      background: #000;
    }

    .fullscreen-button {
      position: fixed;
      z-index: 2;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      color: #fff;
      background: rgba(20, 20, 20, 0.72);
      font: 14px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    @media (orientation: portrait) {
      video {
        width: 100vh;
        height: 100vw;
        width: 100dvh;
        height: 100dvw;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <main class="player">
    <video id="video" src="https://streamshare.wireway.ch/download/tlvfekht" autoplay muted playsinline controls></video>
    <button class="fullscreen-button" id="fullscreenButton" type="button">开启声音 / 横屏全屏</button>
  </main>
  <script>
    const video = document.getElementById("video");
    const fullscreenButton = document.getElementById("fullscreenButton");

    fullscreenButton.addEventListener("click", async () => {
      video.muted = false;
      try {
        await video.play();
      } catch (error) {
        video.controls = true;
      }

      try {
        if (!document.fullscreenElement && video.requestFullscreen) {
          await video.requestFullscreen();
        }
      } catch (error) {
        // Fullscreen may be unavailable in some mobile browsers.
      }

      try {
        if (screen.orientation?.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        // Orientation locking is not supported by every browser.
      }

      fullscreenButton.hidden = true;
    });
  </script>
</body>
</html>
